<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Keys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Velvet (default): wine and oxblood with a crimson accent */
  --t0:#0e0609;--t1:#160a0e;--t2:#1c0d13;--t3:#231118;--t4:#2b151e;--t5:#361a26;--t6:#442231;--t7:#5b2f43;--t8:#77455b;--t9:#98677c;
  --bg:#160a0e;--panel:#1f0f16;--raised:#2a141d;--line:#43222f;
  --ink:#f8ecee;--ink2:#ecd8dc;--muted:#c39ca6;--muted2:#a9838e;
  --accent:#e5384f;--accent-rgb:229,56,79;--on-accent:#fff;--accent2:#f4a9b5;--warm:#e5384f;--grad:#e5384f;
  --signal:#f4a9b5;--signal-rgb:244,169,181;
  --ok:#8fd3a8;--warn:#f2c46b;--bad:#ff6b7d;--rec:#ff3b55;
  --display:"Manrope",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
/* Velvet: wine and oxblood with a crimson accent */
:root[data-theme="velvet"]{--accent:#e5384f;}
/* Sapphire: deep navy blue with an azure accent and ice */
:root[data-theme="sapphire"]{
  --t0:#050a14;--t1:#09101f;--t2:#0d1628;--t3:#111c32;--t4:#16233d;--t5:#1d2d4c;--t6:#26395f;--t7:#344c7a;--t8:#4c6797;--t9:#728bb8;
  --bg:#09101f;--panel:#0f182c;--raised:#152038;--line:#26395f;
  --ink:#eef4fc;--ink2:#d6e1f0;--muted:#98abcb;--muted2:#8294b4;
  --accent:#2e9bff;--accent-rgb:46,155,255;--on-accent:#fff;--accent2:#a9dcff;--warm:#2e9bff;--grad:#2e9bff;
  --signal:#a9dcff;--signal-rgb:169,220,255;
}
/* Emerald: bottle green with a jade accent and mint */
:root[data-theme="emerald"]{
  --t0:#040c09;--t1:#07120e;--t2:#0b1914;--t3:#0f2019;--t4:#142920;--t5:#1a342a;--t6:#234436;--t7:#305b49;--t8:#467864;--t9:#6c9b88;
  --bg:#07120e;--panel:#0e1c17;--raised:#13251e;--line:#22423a;
  --ink:#eef7f2;--ink2:#d5e8de;--muted:#9bbdad;--muted2:#85a798;
  --accent:#1fbf83;--accent-rgb:31,191,131;--on-accent:#04140d;--accent2:#b4ecd2;--warm:#1fbf83;--grad:#1fbf83;
  --signal:#b4ecd2;--signal-rgb:180,236,210;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 20px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--raised);border:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px}
.mark i{background:var(--ink);border-radius:1px}
.mark i:nth-child(2){background:var(--accent)}
.brand h1{font:700 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand .sub{font:500 13px var(--body);color:var(--muted)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono);padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.pill{cursor:pointer}
.led{width:8px;height:8px;border-radius:50%;background:var(--t8);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);display:inline-block}
.led.on{background:var(--ok);box-shadow:0 0 8px color-mix(in srgb,var(--ok) 70%,transparent)}
.led.sig{background:var(--signal);box-shadow:0 0 8px color-mix(in srgb,var(--signal) 70%,transparent)}
.led.warn{background:var(--warn)}
.led.bad{background:var(--bad)}
.led.amber{background:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 70%,transparent)}
.led.rec{background:var(--rec);box-shadow:0 0 10px var(--rec)}
.banner{margin:0 auto 12px;padding:10px 14px;border-radius:8px;border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));background:color-mix(in srgb,var(--accent) 12%,var(--panel));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);grid-template-areas:"keys keys" "loop loop" "profile rack" "fx fx" "voice voice" "lab lab";gap:16px;max-width:1400px;margin:0 auto;padding:0 20px 24px}
.profile{grid-area:profile}.rack{grid-area:rack}.keys{grid-area:keys}.lab{grid-area:lab}.loop{grid-area:loop}.fx{grid-area:fx}.voice{grid-area:voice}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"keys" "loop" "profile" "rack" "fx" "voice" "lab"}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{font:600 15px/1.1 var(--display);letter-spacing:.16em;text-transform:uppercase}
h3{font:600 13px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.tag{font:500 11px var(--mono);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);padding:2px 8px;border-radius:99px}

.btn{font:600 13px/1.2 var(--body);padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--t8)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.learning{border-color:var(--signal);color:var(--signal);animation:pulse 1s ease-in-out infinite}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.btn.learning,.loopbtn[data-state]{animation:none!important}*{transition:none!important}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl-sm{font:600 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.input,.select{background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
.select.inline,.input.inline{width:auto;padding:5px 8px}
.map{font:500 11px var(--mono);color:var(--signal)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.status{font:500 12.5px var(--mono);color:var(--signal);min-height:1.5em}

/* Profile */
.dev-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--raised);border:1px solid var(--line);border-radius:9px}
.dev-badge{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;font:700 17px var(--display);letter-spacing:.06em;background:var(--t2);border:1px solid var(--line);color:var(--accent)}
.dev-name{font:600 17px/1.2 var(--body);word-break:break-word}
.dev-maker{font-size:13px;color:var(--muted)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-family:var(--mono);font-size:12.5px;text-align:right;word-break:break-word}
.seen-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.seen-row:last-child{border-bottom:0}
.seen-row .v{font:500 12px var(--mono);color:var(--muted);text-align:right}
.seen-row>span:nth-child(2){white-space:nowrap}
.seen-row.yes .v{color:var(--ink)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px}
.empty strong{color:var(--ink)}
.monitor{list-style:none;margin:0;padding:8px 10px;background:var(--t1);border:1px solid var(--line);border-radius:8px;font:12px/1.65 var(--mono);height:160px;overflow:auto}
.monitor li{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
.monitor li .k{color:var(--signal)}
.monitor li.off .k{color:var(--muted)}
.monitor li.cc .k{color:var(--accent)}
.monitor li .ch{color:var(--muted)}
.hw{font-size:13px;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:6px;font-size:13px}
.test .t{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start}
.test .t .led{margin-top:6px}
.test .t small{display:block;color:var(--muted);font-size:12px}

/* Sounds */
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.zones{grid-template-columns:1fr}}
.zone{border:1.5px dashed var(--t8);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;background:var(--t3)}
.zone .zl{grid-row:1/3;font:700 13px var(--display);letter-spacing:.16em;text-transform:uppercase;padding:6px 9px;border-radius:6px}
.zone.k .zl{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.zone.p .zl{background:color-mix(in srgb,var(--signal) 16%,transparent);color:var(--signal)}
.zone .zn{font:600 19px/1.2 var(--serif)}
.zone .zs{font-size:12px;color:var(--muted)}
.zone.over{border-style:solid;border-color:var(--ink);background:var(--raised)}
.cat-h{grid-column:1/-1;font:600 11px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.card{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;cursor:grab}
.card.k{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.card.p{border-color:var(--signal);box-shadow:inset 3px 0 0 var(--signal)}
.card.k.p{box-shadow:inset 3px 0 0 var(--accent),inset -3px 0 0 var(--signal)}
.card.dragging{opacity:.5}
.inst{all:unset;cursor:pointer;padding:9px 11px 4px;display:grid;grid-template-columns:1fr auto;gap:1px 8px}
.inst:focus-visible{outline:2px solid var(--signal);outline-offset:-2px;border-radius:8px}
.inst .nm{font:600 14.5px/1.25 var(--body)}
.inst .kbd{font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;height:18px;line-height:16px}
.inst .ds{grid-column:1/-1;color:var(--muted);font-size:12px;line-height:1.35}
.card-z{display:flex;gap:4px;padding:4px 8px 8px}
.zb{flex:1;font:600 10.5px var(--display);letter-spacing:.12em;text-transform:uppercase;padding:3px 0;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.zb.k[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.zb.p[aria-pressed="true"]{background:var(--signal);color:color-mix(in srgb,var(--signal) 18%,#000);border-color:transparent}
.del{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
.del:hover{color:var(--bad);border-color:var(--bad)}
.custom-empty{grid-column:1/-1;font-size:13px;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:8px}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ctl{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl-top label{font:600 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ctl-top .val{font:500 12px var(--mono)}
.ctl-bot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.switchers{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

/* Controller view */
.kb-bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.stepper .val{font:500 13px var(--mono);color:var(--ink);min-width:34px;text-align:center}
.ind{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--muted)}
.ctrl-body{background:linear-gradient(var(--t5),var(--t4));border:1px solid var(--t1);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ctrl-top{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.ctrl-top .lcd{flex:1 1 220px;max-width:340px}
.ctrl-top .knobs{flex:2 1 300px}

.wheels{display:flex;gap:10px;align-items:flex-end}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 10px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wheel .trk{position:relative;width:26px;height:104px;border-radius:7px;background:repeating-linear-gradient(var(--t6) 0 3px,var(--t4) 3px 6px);border:1px solid #000;overflow:hidden}
.wheel .trk i{position:absolute;left:2px;right:2px;height:14px;border-radius:4px;background:linear-gradient(var(--t9),var(--t7));bottom:calc(var(--p,0) * (100% - 14px))}
.wheel .trk b{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0) * 100%);background:color-mix(in srgb,var(--signal) 22%,transparent)}
.wheel.bend .trk b{display:none}
.wheel.on .trk i{background:linear-gradient(color-mix(in srgb,var(--signal) 55%,#fff),var(--signal))}
.lcd{background:var(--t2);border:1px solid #000;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-family:var(--mono);color:var(--signal);box-shadow:inset 0 0 18px rgba(var(--signal-rgb),.08);min-width:0}
.lcd-brand{font:700 12px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;gap:8px}
.lcd-brand span:last-child{color:var(--signal);letter-spacing:.06em}
.lcd-name,.lcd-sub{font-size:12px;color:color-mix(in srgb,var(--signal) 78%,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd-line{font-size:20px;font-weight:500;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.knobs{display:grid;grid-template-columns:repeat(var(--kc,8),minmax(48px,1fr));gap:8px 6px;align-content:center}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10px var(--mono);color:var(--muted);min-width:0;text-align:center}
.knob .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 10.5px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.knob .kn{font:600 10px var(--display);letter-spacing:.1em;color:var(--muted)}
.knob.hot .lbl{color:var(--accent)}
.dial{--v:0;position:relative;width:42px;height:42px;border-radius:50%;background:conic-gradient(from -135deg,var(--accent) calc(var(--v) * 270deg),var(--t6) 0 270deg,transparent 0);display:grid;place-items:center;cursor:ns-resize;touch-action:none;flex:none}
.dial.big{width:64px;height:64px}
.dial .cap{position:relative;width:72%;height:72%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--t7),var(--t2));border:1px solid #000;transform:rotate(calc(-135deg + var(--v) * 270deg));pointer-events:none}
.dial .cap::before{content:"";position:absolute;top:8%;left:calc(50% - 1px);width:2px;height:30%;border-radius:1px;background:var(--ink)}
.pads-wrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pads{display:grid;grid-template-columns:repeat(var(--pc,4),52px);gap:7px;align-content:center}
.pads.small{grid-template-columns:repeat(var(--pc,4),42px)}
.pad{--vel:0;height:52px;border-radius:7px;border:1px solid #000;background:color-mix(in srgb,var(--signal) calc(var(--vel) * 100%),var(--t6));box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 0 calc(var(--vel) * 18px) color-mix(in srgb,var(--signal) 60%,transparent);font:500 9px var(--mono);color:var(--muted);display:flex;align-items:flex-end;justify-content:center;padding:0 2px 4px;cursor:pointer;transition:background .14s,box-shadow .14s;touch-action:none;overflow:hidden;white-space:nowrap}
.pads.small .pad{height:42px}
.pad.on{color:color-mix(in srgb,var(--signal) 18%,#000);transition:none}
.pads-lbl{font:600 10px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
.kb-wrap{overflow-x:auto;padding-bottom:4px;border-radius:8px}
.keyboard{position:relative;height:180px;min-width:calc(var(--wcount,36) * 21px);user-select:none;-webkit-user-select:none;touch-action:none;background:var(--t1);border-radius:8px;border:1px solid #000;overflow:hidden}
.keyboard.over{outline:2px solid var(--accent)}
.key{position:absolute;top:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding-bottom:8px;cursor:pointer}
.key.w{height:100%;background:linear-gradient(#f6f1e6,#e3dccd);border-right:1px solid #9c968a;border-bottom:4px solid #cfc7b6;border-radius:0 0 5px 5px;z-index:1;color:var(--t8)}
.key.b{height:61%;background:linear-gradient(var(--t6),var(--t3) 85%);border:1px solid #000;border-top:0;border-radius:0 0 4px 4px;z-index:2;color:#8b919a;box-shadow:inset 0 -5px 0 rgba(255,255,255,.07)}
.key.w.pl{background:linear-gradient(color-mix(in srgb,var(--signal) 20%,#fff),color-mix(in srgb,var(--signal) 70%,#fff))}
.key.b.pl{background:linear-gradient(color-mix(in srgb,var(--signal) 80%,#fff),color-mix(in srgb,var(--signal) 60%,#000))}
.key.w.on{background:linear-gradient(color-mix(in srgb,var(--accent) 25%,#fff),color-mix(in srgb,var(--accent) 80%,#fff) 75%,var(--accent));border-bottom-color:color-mix(in srgb,var(--accent) 60%,#000)}
.key.b.on{background:linear-gradient(color-mix(in srgb,var(--accent) 90%,#fff),color-mix(in srgb,var(--accent) 60%,#000))}
.key .nl{font:500 10px var(--mono)}
.key .qk{font:500 10px var(--mono);opacity:.75;border:1px solid currentColor;border-radius:3px;padding:0 3px}
.key .dl{font:600 10px var(--display);letter-spacing:.06em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);color:#7a5a3c}

/* Studio scene + replica */
.jump{display:flex;gap:4px;flex-wrap:wrap}
.jump a{color:var(--muted);text-decoration:none;font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:6px}
.jump a:hover{color:var(--ink);background:var(--raised)}
.stage{position:relative;border-radius:12px;overflow:hidden;padding:176px 22px 26px;background:var(--t4);border:1px solid var(--t1)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .ctrl-body{position:relative;z-index:1;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
@media (max-width:760px){.stage{padding:20px 10px 16px}}
.wheel.strip .trk{width:18px;border-radius:4px;background:var(--t3)}
.wheel.strip .trk i{height:6px;border-radius:2px}
